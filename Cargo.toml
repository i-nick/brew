[workspace]
members = ["brew_core", "brew_io", "brew_cli"]
resolver = "3"

[workspace.package]
rust-version = "1.90"

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
console = "0.16.6"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rustls = { version = "0.23.45", features = ["aws-lc-rs"] }
rustls-native-certs = "0.8.4"
flate2 = "1.1.10"
tar = "0.4.46"
xz2 = "0.1.7"
zstd = "0.14.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", features = ["bundled"] }
futures = "0.3.34"
futures-util = "0.3.34"
rayon = "1.12.0"
regex = "1.13.1"
sha2 = "0.11.0"
hex = "0.4.3"
walkdir = "2.5.0"
libc = "0.2.189"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
strsim = "0.11.1"

# Dev dependencies
tempfile = "3.27"
wiremock = "0.6.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
